name: F26 Automatic Slide Upload

on:
  schedule:
    # Tuesdays and Thursdays at 11:00 UTC (after Mon/Wed lectures ET)
    - cron: "0 11 * * 2,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f26-slide-upload
  cancel-in-progress: false

jobs:
  slide-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install ruamel.yaml pytz

      - name: Upload slides to lectures.yaml
        working-directory: F26/pages/tables_data
        run: python upload_slides.py

      - name: Commit updated lectures.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add F26/pages/tables_data/lectures.yaml
          if git diff --cached --quiet; then
            echo "[INFO] No changes - slides already linked or no lecture today."
          else
            echo "[INFO] Committing updated lectures.yaml"
            git commit -m "chore(f26): auto-link slides [skip ci]"
            git push
          fi
