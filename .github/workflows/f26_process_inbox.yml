name: F26 Process Inbox

on:
  schedule:
    # Tuesdays and Thursdays at 10:00 UTC (runs before slide-upload)
    - cron: "0 10 * * 2,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f26-process-inbox
  cancel-in-progress: false

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: tools/f26_discord_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/f26_discord_bot/requirements.txt

      - name: Auto-approve eligible pending uploads
        run: python tools/f26_discord_bot/process_pending_uploads.py --auto-approve-eligible

      - name: Commit processed changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            F26/automation/upload_manifest.jsonl \
            F26/pages/tables_data/lectures.yaml \
            F26/documents/slides
          if git diff --cached --quiet; then
            echo "[INFO] No pending uploads approved - nothing to commit."
          else
            echo "[INFO] Committing approved uploads"
            git commit -m "chore(f26): process inbox approvals [skip ci]"
            git push
          fi
