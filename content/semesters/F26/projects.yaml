# Potential Project Ideas (Fall 2026)
# Canonical data source for the Course Project page

projects:
  - id: 1
    title: "Reinforcement Learning from Pixels"
    category: "Reinforcement Learning (11-785)"
    mentors: "Kangping Liu"
    description: "This project is on model-based reinforcement learning from the pixel space. It focuses on PlaNet and DreamerV1 on DeepMind Control Suite tasks, including latent dynamics models, replay buffers, planning or actor-critic control."
    paper: ""
    dataset: ""
    code: ""
    tags:
      - "RL"
      - "World Models"
      - "Robotics"
    icon: "fas fa-robot"
    color: "#E05A47"

  - id: 3
    title: "Machine Learned Interatomic Potentials"
    category: "AI4Science (11-785)"
    mentors: "Ron Sarma"
    description: "Build an efficient, accurate and competitive machine learned interatomic potential for molecular systems. There is a significant shift of momentum in AI4Science, and this project is intended to be a step in that direction."
    paper: "https://arxiv.org/abs/2506.23971"
    dataset: "https://huggingface.co/facebook/OMol25"
    code: "https://github.com/facebookresearch/fairchem"
    tags:
      - "MLIP"
      - "GNN"
      - "Physics-informed"
    icon: "fas fa-atom"
    color: "#1565C0"

  - id: 4
    title: "Atomic skill library for robotic manipulation"
    category: "Robotics (11-785)"
    mentors: "Nayesha Gandotra"
    description: "You will pick a robotic manipulation domain/task of choice and set it up in Maniskill. Then, using at least 2 distinct deep learning techniques train a set of skills pertinent to the domain. Performance will be compared across chosen techniques."
    paper: ""
    dataset: ""
    code: ""
    tags:
      - "LLMs"
      - "Robotics"
    icon: "fas fa-robot"
    color: "#6A1B9A"

  - id: 5
    title: "Hand and Finger Control from Forearm sEMG"
    category: "Signal Processing (11-785)"
    mentors: "Nayesha Gandotra and Max Murphy"
    description: "This project asks: can deep learning tell which attempted hand and finger movements are distinguishable from surface EMG signals recorded at the forearm? And, is it controllable in a graded, proportional way? Perhaps in real time?"
    paper: ""
    dataset: "Private dataset"
    code: ""
    tags:
      - "EMG"
      - "Signal Processing"
    icon: "fas fa-brain"
    color: "#EF6C00"

  - id: 6
    title: "Perforated Learning for Language Modeling"
    category: "Perforation and NLP (11-785)"
    mentors: "Rorry Brenner and the Perforated AI Team"
    description: "Perforated Backpropagation is a new deep learning paradigm enabling ML models to be built with more parameter efficiency and data efficiency. This project focuses on perforating various ML models in NLP."
    paper: "https://arxiv.org/abs/2501.18018"
    dataset: ""
    code: "https://github.com/PerforatedAI/PerforatedAI"
    tags:
      - "Neuroscience"
      - "Dendritic Optimization"
    icon: "fas fa-brain"
    color: "#156239"

