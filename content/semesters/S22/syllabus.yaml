policies:
  - category: Score Assignment
    details: Grading will be based on weekly quizzes (24%), homeworks (50%) and a course project (25%). Note that 1% of your grade is assigned to Attendance.
  - category: Quizzes
    details: There will be weekly quizzes. We will retain your best 12 out of the remaining 14 quizzes. Quizzes are scored by the number of correct answers and are worth 24% of your overall score.
  - category: Assignments
    details: There will be four/five assignments in all, plus the Peer Review assignment during the last week of the semester. Assignments carry 50% of your total score.
  - category: Course Project
    details: All students taking a graduate version of the course are required to do a course project. The project is worth 25% of your grade.
  - category: Attendance
    details: If you are in section A you are expected to attend in-person lectures. We will track attendance.
  - category: Grading & Curves
    details: The end-of-term grade is curved. Your overall grade will depend on your performance relative to your classmates.
resources:
